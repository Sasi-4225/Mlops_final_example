services:
  api:
    build: .
    container_name: heart-disease-api
    ports:
      - "8000:8000"
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    container_name: heart-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    container_name: heart-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana\n      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro\n      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
volumes:
  grafana-data:
